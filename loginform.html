<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page - MY SHOP</title>
    <!-- Import Bootstrap External (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome External (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="text-center mb-3">
            <a href="layout.html" class="text-decoration-none">
                <h4 class="fw-bold text-primary"><i class="fas fa-cart-plus me-2 text-success"></i>MY SHOP</h4>
            </a>
        </div>
        <h2 class="text-center fw-bold">Login</h2>
        <form action="dashboard.html" method="get">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required value="admin">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required value="12345678">
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label" for="rememberMe">Ingat Saya</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="fas fa-sign-in-alt me-1"></i> Masuk ke Dashboard
            </button>
        </form>
        
        <p class="text-center mt-3 mb-1">
            <a href="#" class="link-primary text-decoration-none" data-bs-toggle="modal" data-bs-target="#lupaPasswordModal">Lupa Password?</a>
        </p>
        <p class="text-center mb-3">
            Belum punya akun? <a href="#" class="link-primary text-decoration-none fw-semibold" data-bs-toggle="modal" data-bs-target="#registerModal">Daftar Sekarang</a>
        </p>
        <hr>
        <div class="text-center">
            <a href="layout.html" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Kembali ke Toko (layout.html)
            </a>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div class="modal fade" id="lupaPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-key me-2"></i>Reset Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Masukkan alamat email akun Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi.</p>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Terdaftar</label>
                        <input type="email" class="form-control" placeholder="nama@email.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="alert('Instruksi reset password telah dikirim ke email!');" data-bs-dismiss="modal">Kirim Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Registrasi Akun Baru -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Daftar Akun Baru</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form onsubmit="event.preventDefault(); alert('Pendaftaran berhasil! Silakan login.'); location.reload();">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Lengkap</label>
                            <input type="text" class="form-control" placeholder="Delvian Permana Putra" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" placeholder="delvian@polibatam.ac.id" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" placeholder="delvian123" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" placeholder="Minimal 8 karakter" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Daftar Akun</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Bootstrap JS External (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
