<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Mode Tanpa Koneksi</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
      background-color: #fafaf9;
      color: #1c1917;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 1.25rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 24rem;
      width: 100%;
      border: 1px solid #e7e5e4;
    }
    .icon {
      width: 3.5rem;
      height: 3.5rem;
      margin-bottom: 1rem;
      color: #78716c;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p {
      color: #78716c;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19v-6m-3 3l3-3 3 3" />
    </svg>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi sedang offline. Halaman yang pernah dibuka tetap dapat dilihat, atau coba segarkan kembali setelah terhubung ke internet.</p>
    <button onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
